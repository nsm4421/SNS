name: karma
description: "karma app"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  injectable: ^2.5.0

  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  auto_route: ^10.1.2
  image_picker: ^1.2.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.2.1
  envied: ^1.3.0

  supabase: ^2.9.1
  supabase_codegen: ^2.0.0
  flutter_secure_storage: ^9.2.4

  # util
  uuid: ^4.5.1
  timezone: ^0.10.1
  fpdart: ^1.1.1
  freezed_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.5.4
  injectable_generator: ^2.6.2
  envied_generator: ^1.3.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  melos: ^7.1.1
  auto_route_generator: ^10.1.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  copy_with_extension_gen: ^9.1.1
  test: ^1.26.2

flutter:
  uses-material-design: true

supabase_codegen:
  env: .env
  output: lib/data/datasource/db/generated
  tag: v1
  debug: true
  skipFooter: true
