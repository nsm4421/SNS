name: data
description: data layer
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ^3.32.0

dependencies:
  flutter:
    sdk: flutter
  shared:
    path: ../shared
  domain:
    path: ../domain
  freezed: ^3.0.4
  freezed_annotation: ^3.0.0
  either_dart: ^1.0.0
  envied: ^1.1.1
  get_it: ^8.0.3
  injectable: ^2.5.0
  logger: ^2.5.0
  copy_with_extension: ^6.0.1
  supabase_flutter: ^2.9.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.6.2
  envied_generator: ^1.1.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  copy_with_extension_gen: ^6.0.1
  supabase_codegen: ^1.4.0

supabase_codegen:
  env: .env.codegen # Overrides default: .env
  output: lib/datasource/database # Overrides default: supabase/types
  tag: v1 # Overrides default: ''
  debug: true # Overrides default: false
  skipFooter: true # Overrides default: false
