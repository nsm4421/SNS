name: supabase_datasource
description: A Very Good Project created by Very Good CLI.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  supabase: ^2.9.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  injectable: ^2.5.1
  envied: ^1.3.0
  supabase_codegen: ^2.0.0
  logger: ^2.6.1
  flutter_secure_storage: ^9.2.4
  shared:
    path: ../shared

dev_dependencies:
  build_runner: ^2.4.12
  envied_generator: ^1.3.0
  json_serializable: ^6.9.0
  freezed: ^3.2.3
  injectable_generator: ^2.8.1
  mocktail: ^1.0.4
  test: ^1.26.2
  very_good_analysis: ^9.0.0

# run : dart run supabase_codegen:generate_types
# .env파일에 SUPABASE_URL, SUPABASE_KEY(supabase service key)키값으로 환경변수를 읽음
supabase_codegen:
  output: lib/src/models/supabase
  tag: v1
  debug: true
  skipFooter: true